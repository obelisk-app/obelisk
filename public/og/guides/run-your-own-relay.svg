" fill="#fafafa">6,000/min</text></g><g opacity="0.72"><rect x="470" y="134" width="290" height="48" rx="12" fill="#171717" stroke="#b4f953" stroke-width="1.4"></rect><text x="490" y="154" font-size="14" font-weight="800" fill="#b4f953" font-family="monospace">TIER 2</text><text x="490" y="171" font-size="11" font-weight="600" fill="#fafafa" opacity="0.75">two hops</text><text x="742" y="162" text-anchor="end" font-size="13" font-weight="700" fill="#fafafa">3,000/min</text></g><g opacity="0.46"><rect x="470" y="196" width="290" height="48" rx="12" fill="#171717" stroke="#b4f953" stroke-width="1.4"></rect><text x="490" y="216" font-size="14" font-weight="800" fill="#b4f953" font-family="monospace">TIER 3</text><text x="490" y="233" font-size="11" font-weight="600" fill="#fafafa" opacity="0.75">three hops</text><text x="742" y="224" text-anchor="end" font-size="13" font-weight="700" fill="#fafafa">1,500/min</text></g><g><rect x="470" y="282" width="290" height="48" rx="12" fill="#1a0f0f" stroke="#f87171" stroke-width="1.4"></rect><text x="490" y="302" font-size="14" font-weight="800" fill="#f87171" font-family="monospace">BLOCKED</text><text x="490" y="319" font-size="11" font-weight="600" fill="#fafafa" opacity="0.7">checked first, overrides every tier</text><text x="742" y="310" text-anchor="end" font-size="13" font-weight="700" fill="#f87171">nothing</text></g></g><g opacity="0.9"><line x1="352" y1="336" x2="424" y2="312" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 6"></line><circle cx="352" cy="336" r="5" fill="none" stroke="#f87171" stroke-width="2"></circle><line x1="348.5" y1="332.5" x2="355.5" y2="339.5" stroke="#f87171" stroke-width="2" stroke-linecap="round"></line><line x1="355.5" y1="332.5" x2="348.5" y2="339.5" stroke="#f87171" stroke-width="2" stroke-linecap="round"></line></g><text x="470" y="356" font-size="11.5" font-weight="600" fill="#a3a3a3">Distance from your reference accounts</text><text x="470" y="373" font-size="11.5" font-weight="600" fill="#a3a3a3">is how much evidence you have.</text></svg>