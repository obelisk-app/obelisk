<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-how-title hero-how-desc" class="w-full h-auto"><title id="hero-how-title">How Obelisk works</title><desc id="hero-how-desc">On a usual chat platform, your account, your data and the rules live on the company&#x27;s server, between you and your community. In Obelisk you sign each message with your own key and it goes straight to your community&#x27;s relay, a NIP-29 relay: Obelisk runs a public one, and anyone can run their own. The Obelisk app only signs and shows.</desc><defs><linearGradient id="sky-how" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a0a"></stop><stop offset="100%" stop-color="#141c0c"></stop></linearGradient><linearGradient id="how-obelisk-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b4f953"></stop><stop offset="100%" stop-color="#8bc34a"></stop></linearGradient><radialGradient id="how-server-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#b4f953" stop-opacity="0.22"></stop><stop offset="100%" stop-color="#b4f953" stop-opacity="0"></stop></radialGradient><marker id="how-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4f953"></path></marker><marker id="how-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"></path></marker></defs><rect width="800" height="400" fill="url(#sky-how)"></rect><g><text x="24" y="54" font-size="11.5" font-weight="700" fill="#737373" font-family="monospace" letter-spacing="1.5">A USUAL CHAT PLATFORM</text><g stroke="#737373" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="95" cy="90" r="11"></circle><path d="M75 124 C 75 106, 115 106, 115 124"></path></g><text x="95" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#a3a3a3">You</text><line x1="150" y1="108" x2="262" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#how-arrow-dim)"></line><text x="206" y="98" text-anchor="middle" font-size="12" font-weight="400" fill="#737373">message</text><rect x="268" y="66" width="280" height="84" rx="12" fill="#141414" stroke="#404040" stroke-width="1.6"></rect><g stroke="#737373" stroke-width="1.8" fill="none"><g><rect x="288" y="92" width="30" height="9" rx="2"></rect><circle cx="294" cy="96.5" r="1.3" fill="#737373" stroke="none"></circle></g><g><rect x="288" y="104" width="30" height="9" rx="2"></rect><circle cx="294" cy="108.5" r="1.3" fill="#737373" stroke="none"></circle></g><g><rect x="288" y="116" width="30" height="9" rx="2"></rect><circle cx="294" cy="120.5" r="1.3" fill="#737373" stroke="none"></circle></g></g><text x="334" y="101" font-size="14.5" font-weight="700" fill="#d4d4d4">The company&#x27;s server</text><text x="334" y="122" font-size="11.5" fill="#f87171">your account · your data · its rules</text><line x1="552" y1="108" x2="646" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#how-arrow-dim)"></line><g><g opacity="0.55"><g stroke="#737373" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="679" cy="94" r="11"></circle><path d="M659 128 C 659 110, 699 110, 699 128"></path></g><g stroke="#737373" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="731" cy="94" r="11"></circle><path d="M711 128 C 711 110, 751 110, 751 128"></path></g></g><g stroke="#737373" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="705" cy="88" r="11"></circle><path d="M685 122 C 685 104, 725 104, 725 122"></path></g></g><text x="705" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#a3a3a3">Your community</text></g><line x1="24" y1="190" x2="776" y2="190" stroke="#262626" stroke-width="1" stroke-dasharray="4 6"></line><g><text x="24" y="228" font-size="11.5" font-weight="700" fill="#b4f953" font-family="monospace" letter-spacing="1.5">OBELISK</text><g stroke="#b4f953" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="95" cy="264" r="11"></circle><path d="M75 298 C 75 280, 115 280, 115 298"></path></g><g><circle cx="120" cy="294" r="12" fill="#0a0a0a" stroke="#b4f953" stroke-width="1.6"></circle><g stroke="#b4f953" stroke-width="1.6" fill="none" stroke-linecap="round"><circle cx="117" cy="294" r="4.5"></circle><line x1="122" y1="294" x2="131" y2="294"></line><line x1="128" y1="294" x2="128" y2="298"></line></g></g><text x="95" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#fafafa">You, with your key</text><line x1="150" y1="282" x2="262" y2="282" stroke="#b4f953" stroke-width="2" stroke-dasharray="6 6"  marker-end="url(#how-arrow)"></line><text x="206" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#b4f953">signed message</text><circle cx="300" cy="282" r="54" fill="url(#how-server-glow)"  style="transform-origin:300px 282px;transform-box:fill-box"></circle><rect x="268" y="236" width="280" height="92" rx="12" fill="#0f160a" stroke="#b4f953" stroke-width="1.8"></rect><g><g transform="translate(269.28 248.08) scale(0.12)"><path d="M 256,16 L 220,72 L 196,460 L 200,464 L 256,464 L 256,72 Z" fill="#8bc34a" opacity="0.85"></path><path d="M 256,16 L 292,72 L 316,460 L 312,464 L 256,464 L 256,72 Z" fill="url(#how-obelisk-body)"></path></g><rect x="289" y="304" width="22" height="4" fill="#8bc34a"></rect></g><text x="334" y="268" font-size="14.5" font-weight="700" fill="#fafafa">Your community&#x27;s relay</text><text x="334" y="289" font-size="11.5" fill="#b4f953">Obelisk&#x27;s relay</text><text x="334" y="306" font-size="11.5" fill="#b4f953">or your own</text><line x1="552" y1="282" x2="646" y2="282" stroke="#b4f953" stroke-width="2" stroke-dasharray="6 6"  marker-end="url(#how-arrow)"></line><g><g opacity="0.55"><g stroke="#b4f953" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="679" cy="268" r="11"></circle><path d="M659 302 C 659 284, 699 284, 699 302"></path></g><g stroke="#b4f953" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="731" cy="268" r="11"></circle><path d="M711 302 C 711 284, 751 284, 751 302"></path></g></g><g stroke="#b4f953" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="705" cy="262" r="11"></circle><path d="M685 296 C 685 278, 725 278, 725 296"></path></g></g><text x="705" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#fafafa">Your community</text></g><text x="400" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#b4f953">Use Obelisk&#x27;s relay or run your own: your community depends on no one.</text></svg>