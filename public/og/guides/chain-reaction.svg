#ff4d5e" fill-opacity="0.9"></circle><circle cx="357" cy="277" r="7" fill="#ff4d5e" fill-opacity="0.9"></circle></g><g><circle cx="465" cy="285" r="7" fill="#b4f953" fill-opacity="0.9"></circle></g><g><circle cx="249" cy="177" r="52" fill="url(#cr-burst-glow)"></circle><circle cx="249" cy="177" r="20" fill="none" stroke="#b4f953" stroke-width="2.5" stroke-opacity="0.9"></circle><circle cx="249" cy="147.3" r="8" fill="#b4f953"></circle><circle cx="249" cy="206.7" r="8" fill="#b4f953"></circle><circle cx="219.3" cy="177" r="8" fill="#b4f953"></circle><circle cx="278.7" cy="177" r="8" fill="#b4f953"></circle></g><g font-weight="600"><text x="540" y="118" fill="#fafafa" font-size="15">One orb over the limit</text><text x="540" y="140" fill="#a3a3a3" font-size="11">every neighbour takes one,</text><text x="540" y="156" fill="#a3a3a3" font-size="11">and may burst in turn</text><g font-family="ui-monospace, monospace"><rect x="540" y="186" width="216" height="58" rx="10" fill="#171717" stroke="#262626"></rect><text x="558" y="210" fill="#b4f953" font-size="12">kind 2390</text><text x="558" y="230" fill="#a3a3a3" font-size="11">{&quot;op&quot;:&quot;move&quot;,&quot;cell&quot;:11}</text></g><text x="540" y="266" fill="#a3a3a3" font-size="11">the cascade is replayed,</text><text x="540" y="282" fill="#a3a3a3" font-size="11">never published</text><g><circle cx="548" cy="316" r="6" fill="#ff4d5e"></circle><text x="564" y="320" fill="#a3a3a3" font-size="11">seat 1</text></g><g><circle cx="548" cy="338" r="6" fill="#b4f953"></circle><text x="564" y="342" fill="#a3a3a3" font-size="11">seat 2</text></g><g><circle cx="548" cy="360" r="6" fill="#38bdf8"></circle><text x="564" y="364" fill="#a3a3a3" font-size="11">seat 3</text></g></g></svg>