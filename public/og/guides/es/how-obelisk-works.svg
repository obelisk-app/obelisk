<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-how-title hero-how-desc" class="w-full h-auto"><title id="hero-how-title">Cómo funciona Obelisk</title><desc id="hero-how-desc">La app web de Obelisk corre en tu navegador y firma cada evento con tu clave, que se queda con vos. Habla directo con tu servidor, un relay NIP-29 que guarda los canales, los mensajes y los roles y hace cumplir sus reglas, y llega por su cuenta a otros relays Nostr para perfiles y DMs. La voz va de par a par o pasa por un SFU, y los zaps se pagan desde tu wallet Lightning. No hay ningún servidor de Obelisk en el medio.</desc><defs><linearGradient id="sky-how" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a0a"></stop><stop offset="100%" stop-color="#1e2812"></stop></linearGradient><linearGradient id="how-obelisk-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b4f953"></stop><stop offset="100%" stop-color="#8bc34a"></stop></linearGradient><radialGradient id="how-server-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#b4f953" stop-opacity="0.28"></stop><stop offset="100%" stop-color="#b4f953" stop-opacity="0"></stop></radialGradient><marker id="how-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4f953"></path></marker></defs><rect width="800" height="400" fill="url(#sky-how)"></rect><g opacity="0.12" stroke="#b4f953" stroke-width="0.5"><line x1="0" y1="50" x2="800" y2="50"></line><line x1="0" y1="100" x2="800" y2="100"></line><line x1="0" y1="150" x2="800" y2="150"></line><line x1="0" y1="200" x2="800" y2="200"></line><line x1="0" y1="250" x2="800" y2="250"></line><line x1="0" y1="300" x2="800" y2="300"></line><line x1="0" y1="350" x2="800" y2="350"></line><line x1="0" y1="400" x2="800" y2="400"></line></g><g><circle cx="410" cy="180" r="110" fill="url(#how-server-glow)"  style="transform-origin:410px 180px;transform-box:fill-box"></circle><g transform="translate(309.9 77.7) scale(0.391)"><path d="M 256,16 L 220,72 L 196,460 L 200,464 L 256,464 L 256,72 Z" fill="#8bc34a" opacity="0.85"></path><path d="M 256,16 L 292,72 L 316,460 L 312,464 L 256,464 L 256,72 Z" fill="url(#how-obelisk-body)"></path></g><rect x="382" y="259" width="56" height="8" fill="#8bc34a"></rect><rect x="372" y="267" width="76" height="6" fill="#2d3a1a"></rect><text x="410" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#fafafa">Tu servidor (un relay NIP-29)</text><text x="410" y="315" text-anchor="middle" font-size="10.5" fill="#a3a3a3">Canales · Mensajes · Roles</text><text x="410" y="331" text-anchor="middle" font-size="10" font-weight="600" fill="#b4f953">guarda el grupo y hace cumplir sus reglas</text></g><g><rect x="16" y="18" width="236" height="104" rx="12" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.6"></rect><g stroke="#b4f953" stroke-width="1.6" fill="none" stroke-linecap="round"><circle cx="32" cy="36" r="4.5"></circle><line x1="37" y1="36" x2="46" y2="36"></line><line x1="43" y1="36" x2="43" y2="40"></line></g><text x="54" y="40" font-size="12" font-weight="700" fill="#fafafa">Tu clave se queda con vos</text><g><g stroke="#b4f953" stroke-width="1.2" fill="none" stroke-linecap="round"><rect x="30" y="53.5" width="12" height="9" rx="1.5"></rect><line x1="30" y1="56.5" x2="42" y2="56.5"></line></g><text x="50" y="62" font-size="10.5" font-weight="600" fill="#fafafa">Extensión</text></g><text x="240" y="62" font-size="9.5" fill="#b4f953" font-family="monospace" text-anchor="end">NIP-07</text><g><g stroke="#b4f953" stroke-width="1.2" fill="none" stroke-linecap="round"><rect x="32" y="72" width="8" height="12" rx="1.5"></rect><line x1="35" y1="81.5" x2="37" y2="81.5"></line></g><text x="50" y="82" font-size="10.5" font-weight="600" fill="#fafafa">App firmante</text></g><text x="240" y="82" font-size="9.5" fill="#b4f953" font-family="monospace" text-anchor="end">NIP-46</text><g><g stroke="#b4f953" stroke-width="1.2" fill="none" stroke-linecap="round"><rect x="31" y="97" width="10" height="7" rx="1.5"></rect><path d="M33 97 v-2 a3 3 0 0 1 6 0 v2"></path></g><text x="50" y="102" font-size="10.5" font-weight="600" fill="#fafafa">Sesión cifrada</text></g><text x="240" y="102" text-anchor="end" font-size="9.5" fill="#a3a3a3">en este dispositivo</text><line x1="134" y1="122" x2="134" y2="160" stroke="#b4f953" stroke-width="1.6" stroke-dasharray="4 5" ></line><rect x="98" y="129" width="72" height="22" rx="11" fill="#b4f953"></rect><text x="134" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0a0a0a">Firmar</text></g><g><rect x="16" y="160" width="236" height="150" rx="12" fill="#0f0f0f" stroke="#b4f953" stroke-width="1.6"></rect><path d="M16 184 V172 a12 12 0 0 1 12 -12 H240 a12 12 0 0 1 12 12 V184 Z" fill="#1a1a1a"></path><line x1="16" y1="184" x2="252" y2="184" stroke="#262626" stroke-width="1"></line><circle cx="32" cy="172" r="3.2" fill="#5c7a2e"></circle><circle cx="44" cy="172" r="3.2" fill="#5c7a2e"></circle><circle cx="56" cy="172" r="3.2" fill="#5c7a2e"></circle><text x="70" y="176" font-size="10" font-weight="600" fill="#a3a3a3">En tu navegador</text><g><rect x="24" y="192" width="220" height="40" rx="8" fill="#141414" stroke="#5c7a2e" stroke-width="1.2"></rect><rect x="32" y="199" width="26" height="26" rx="6" fill="#2d3a1a"></rect><g stroke="#b4f953" stroke-width="1.3" fill="none" stroke-linecap="round"><rect x="40" y="205" width="10" height="14" rx="1.5"></rect><line x1="42.5" y1="209.5" x2="47.5" y2="209.5"></line><line x1="42.5" y1="213" x2="47.5" y2="213"></line></g><text x="66" y="209" font-size="11.5" font-weight="700" fill="#fafafa">Páginas estáticas</text><text x="66" y="223" font-size="9.5" fill="#a3a3a3">inicio, guías, ayuda</text></g><g><rect x="24" y="238" width="220" height="40" rx="8" fill="#141414" stroke="#b4f953" stroke-width="1.2"></rect><rect x="32" y="245" width="26" height="26" rx="6" fill="#2d3a1a"></rect><g stroke="#b4f953" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M38 253 h14 v9 h-8 l-3.5 3.5 v-3.5 h-2.5 z"></path></g><text x="66" y="255" font-size="11.5" font-weight="700" fill="#fafafa">La app de Obelisk</text><text x="66" y="269" font-size="9.5" fill="#a3a3a3">chat, voz, DMs, zaps</text></g><circle cx="34" cy="294" r="6" fill="none" stroke="#b4f953" stroke-width="1.3"></circle><circle cx="34" cy="294" r="2.6" fill="#b4f953"  style="transform-origin:34px 294px"></circle><text x="46" y="298" font-size="10" font-weight="700" fill="#b4f953">Un solo gestor de conexiones</text></g><g><g><circle cx="662" cy="110" r="20" fill="#171717" stroke="#b4f953" stroke-width="1.5"></circle><circle cx="662" cy="110" r="12" fill="#b4f953" opacity="0.5"  style="transform-origin:662px 110px;animation-delay:0s"></circle></g><g><circle cx="736" cy="138" r="18" fill="#171717" stroke="#b4f953" stroke-width="1.5"></circle><circle cx="736" cy="138" r="10" fill="#b4f953" opacity="0.5"  style="transform-origin:736px 138px;animation-delay:0.4s"></circle></g><g><circle cx="692" cy="186" r="22" fill="#171717" stroke="#b4f953" stroke-width="1.5"></circle><circle cx="692" cy="186" r="14" fill="#b4f953" opacity="0.5"  style="transform-origin:692px 186px;animation-delay:0.8s"></circle></g><g><circle cx="614" cy="166" r="16" fill="#171717" stroke="#b4f953" stroke-width="1.5"></circle><circle cx="614" cy="166" r="8" fill="#b4f953" opacity="0.5"  style="transform-origin:614px 166px;animation-delay:1.2000000000000002s"></circle></g><g><circle cx="756" cy="206" r="14" fill="#171717" stroke="#b4f953" stroke-width="1.5"></circle><circle cx="756" cy="206" r="6" fill="#b4f953" opacity="0.5"  style="transform-origin:756px 206px;animation-delay:1.6s"></circle></g><text x="686" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#fafafa">Otros relays Nostr</text><text x="686" y="264" text-anchor="middle" font-size="10" fill="#a3a3a3">Perfiles · DMs (NIP-17)</text><g><rect x="556" y="284" width="228" height="54" rx="10" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.4"></rect><rect x="566" y="297" width="28" height="28" rx="7" fill="#2d3a1a"></rect><g transform="translate(580 311)"><g><path d="M0 -7 L-7 5 L7 5 Z" fill="none" stroke="#b4f953" stroke-width="1.1" opacity="0.8"></path><circle cx="0" cy="-7" r="2.8" fill="#b4f953"></circle><circle cx="-7" cy="5" r="2.8" fill="#b4f953"></circle><circle cx="7" cy="5" r="2.8" fill="#b4f953"></circle></g></g><text x="606" y="301" font-size="11.5" font-weight="700" fill="#fafafa">Voz</text><text x="606" y="316" font-size="9.5" fill="#a3a3a3">de par a par (malla WebRTC)</text><text x="606" y="329" font-size="9.5" fill="#a3a3a3">o un SFU que elige el admin</text></g><g><rect x="556" y="346" width="228" height="42" rx="10" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.4"></rect><rect x="566" y="353" width="28" height="28" rx="7" fill="#2d3a1a"></rect><g transform="translate(580 367)"><polygon points="2,-9 -5,1 -1,1 -2,9 5,-2 1,-2" fill="#b4f953"></polygon></g><text x="606" y="363" font-size="11.5" font-weight="700" fill="#fafafa">Wallet Lightning</text><text x="606" y="378" font-size="9.5" fill="#a3a3a3">zaps, por WebLN o NWC</text></g></g><path d="M258 292 C 300 292, 326 256, 380 256" stroke="#b4f953" stroke-width="2" fill="none" stroke-dasharray="6 6"  marker-start="url(#how-arrow)" marker-end="url(#how-arrow)"></path><text x="326" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b4f953">eventos firmados</text><text x="326" y="245" text-anchor="middle" font-size="9.5" fill="#a3a3a3">por un WebSocket</text><path d="M256 284 C 300 0, 560 0, 640 98" stroke="#8bc34a" stroke-width="1.6" fill="none" stroke-dasharray="5 7" opacity="0.85"  style="animation-duration:3s" marker-end="url(#how-arrow)"></path><text x="482" y="30" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8bc34a">perfiles + DMs</text><g stroke="#8bc34a" stroke-width="1.4" fill="none" stroke-dasharray="3 6" opacity="0.8"><path d="M252 304 C 330 376, 480 376, 552 312"  marker-end="url(#how-arrow)"></path><path d="M252 306 C 330 396, 480 396, 552 367"  marker-end="url(#how-arrow)"></path></g></svg>