<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-how-title hero-how-desc" class="w-full h-auto"><title id="hero-how-title">Cómo funciona Obelisk</title><desc id="hero-how-desc">La app web de Obelisk corre en tu navegador y firma cada evento con tu clave, que se queda con vos. Habla directo con tu servidor, un relay NIP-29 que guarda los canales, los mensajes y los roles y hace cumplir sus reglas, y llega por su cuenta a otros relays Nostr para perfiles y DMs. La voz va de par a par o pasa por un SFU, y los zaps se pagan desde tu wallet Lightning. No hay ningún servidor de Obelisk en el medio.</desc><defs><linearGradient id="sky-how" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a0a"></stop><stop offset="100%" stop-color="#1e2812"></stop></linearGradient><linearGradient id="how-obelisk-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b4f953"></stop><stop offset="100%" stop-color="#8bc34a"></stop></linearGradient><radialGradient id="how-server-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#b4f953" stop-opacity="0.28"></stop><stop offset="100%" stop-color="#b4f953" stop-opacity="0"></stop></radialGradient><marker id="how-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4f953"></path></marker></defs><rect width="800" height="400" fill="url(#sky-how)"></rect><g opacity="0.12" stroke="#b4f953" stroke-width="0.5"><line x1="0" y1="50" x2="800" y2="50"></line><line x1="0" y1="100" x2="800" y2="100"></line><line x1="0" y1="150" x2="800" y2="150"></line><line x1="0" y1="200" x2="800" y2="200"></line><line x1="0" y1="250" x2="800" y2="250"></line><line x1="0" y1="300" x2="800" y2="300"></line><line x1="0" y1="350" x2="800" y2="350"></line><line x1="0" y1="400" x2="800" y2="400"></line></g><g><rect x="16" y="40" width="200" height="170" rx="12" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.6"></rect><g stroke="#b4f953" stroke-width="1.6" fill="none" stroke-linecap="round"><circle cx="32" cy="64" r="4.5"></circle><line x1="37" y1="64" x2="46" y2="64"></line><line x1="43" y1="64" x2="43" y2="68"></line></g><text x="52" y="68" font-size="12" font-weight="700" fill="#fafafa">Tu clave se queda con vos</text><line x1="30" y1="84" x2="202" y2="84" stroke="#262626" stroke-width="1"></line><g><g stroke="#b4f953" stroke-width="1.2" fill="none" stroke-linecap="round"><rect x="32" y="101" width="12" height="9" rx="1.5"></rect><line x1="32" y1="104" x2="44" y2="104"></line></g><text x="54" y="110" font-size="13" font-weight="600" fill="#fafafa">Extensión</text></g><text x="204" y="110" font-size="11" fill="#b4f953" font-family="monospace" text-anchor="end">NIP-07</text><g><g stroke="#b4f953" stroke-width="1.2" fill="none" stroke-linecap="round"><rect x="34" y="129.5" width="8" height="12" rx="1.5"></rect><line x1="37" y1="139" x2="39" y2="139"></line></g><text x="54" y="140" font-size="13" font-weight="600" fill="#fafafa">App firmante</text></g><text x="204" y="140" font-size="11" fill="#b4f953" font-family="monospace" text-anchor="end">NIP-46</text><g><g stroke="#b4f953" stroke-width="1.2" fill="none" stroke-linecap="round"><rect x="33" y="164.5" width="10" height="7" rx="1.5"></rect><path d="M35 164.5 v-2 a3 3 0 0 1 6 0 v2"></path></g><text x="54" y="170" font-size="13" font-weight="600" fill="#fafafa">Sesión cifrada</text></g><text x="54" y="188" font-size="11" fill="#a3a3a3">en este dispositivo</text></g><g><rect x="270" y="40" width="216" height="170" rx="12" fill="#0f0f0f" stroke="#b4f953" stroke-width="1.6"></rect><path d="M270 64 V52 a12 12 0 0 1 12 -12 H474 a12 12 0 0 1 12 12 V64 Z" fill="#1a1a1a"></path><line x1="270" y1="64" x2="486" y2="64" stroke="#262626" stroke-width="1"></line><circle cx="286" cy="52" r="3.2" fill="#5c7a2e"></circle><circle cx="298" cy="52" r="3.2" fill="#5c7a2e"></circle><circle cx="310" cy="52" r="3.2" fill="#5c7a2e"></circle><text x="324" y="56" font-size="11" font-weight="600" fill="#a3a3a3">En tu navegador</text><rect x="286" y="86" width="32" height="32" rx="8" fill="#2d3a1a"></rect><path d="M295 96 h14 v9 h-8 l-3.5 3.5 v-3.5 h-2.5 z" stroke="#b4f953" stroke-width="1.3" fill="none" stroke-linecap="round"></path><text x="328" y="99" font-size="15" font-weight="700" fill="#fafafa">La app de Obelisk</text><text x="328" y="117" font-size="12" fill="#a3a3a3">chat, voz, DMs, zaps</text><line x1="286" y1="160" x2="470" y2="160" stroke="#262626" stroke-width="1"></line><circle cx="294" cy="183" r="6" fill="none" stroke="#b4f953" stroke-width="1.3"></circle><circle cx="294" cy="183" r="2.6" fill="#b4f953"  style="transform-origin:294px 183px"></circle><text x="306" y="187" font-size="10" font-weight="700" fill="#b4f953">Un solo gestor de conexiones</text></g><g><circle cx="690" cy="100" r="92" fill="url(#how-server-glow)"  style="transform-origin:690px 100px;transform-box:fill-box"></circle><g transform="translate(620.9 25.7) scale(0.27)"><path d="M 256,16 L 220,72 L 196,460 L 200,464 L 256,464 L 256,72 Z" fill="#8bc34a" opacity="0.85"></path><path d="M 256,16 L 292,72 L 316,460 L 312,464 L 256,464 L 256,72 Z" fill="url(#how-obelisk-body)"></path></g><rect x="666" y="151" width="48" height="7" fill="#8bc34a"></rect><rect x="658" y="158" width="64" height="5" fill="#2d3a1a"></rect><text x="690" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#fafafa">Tu servidor (un relay NIP-29)</text><text x="690" y="202" text-anchor="middle" font-size="12" fill="#a3a3a3">Canales · Mensajes · Roles</text><text x="690" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#b4f953">guarda el grupo y hace cumplir sus reglas</text></g><g><g><rect x="16" y="282" width="244" height="72" rx="10" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.4"></rect><rect x="28" y="302" width="32" height="32" rx="8" fill="#2d3a1a"></rect><g transform="translate(44 318)"><g><circle cx="-6" cy="-3" r="4.5" fill="none" stroke="#b4f953" stroke-width="1.3"></circle><circle cx="5" cy="-5" r="3.6" fill="none" stroke="#b4f953" stroke-width="1.3"></circle><circle cx="3" cy="6" r="4" fill="none" stroke="#b4f953" stroke-width="1.3"></circle></g></g><text x="68" y="309" font-size="13" font-weight="700" fill="#fafafa">Otros relays Nostr</text><text x="68" y="327" font-size="11" fill="#a3a3a3">Perfiles · DMs (NIP-17)</text></g><g><rect x="278" y="282" width="244" height="72" rx="10" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.4"></rect><rect x="290" y="302" width="32" height="32" rx="8" fill="#2d3a1a"></rect><g transform="translate(306 318)"><g><path d="M0 -7 L-7 5 L7 5 Z" fill="none" stroke="#b4f953" stroke-width="1.1" opacity="0.8"></path><circle cx="0" cy="-7" r="2.8" fill="#b4f953"></circle><circle cx="-7" cy="5" r="2.8" fill="#b4f953"></circle><circle cx="7" cy="5" r="2.8" fill="#b4f953"></circle></g></g><text x="330" y="305" font-size="13" font-weight="700" fill="#fafafa">Voz</text><text x="330" y="322" font-size="11" fill="#a3a3a3">de par a par (malla WebRTC)</text><text x="330" y="337" font-size="11" fill="#a3a3a3">o un SFU que elige el admin</text></g><g><rect x="540" y="282" width="244" height="72" rx="10" fill="#0f0f0f" stroke="#5c7a2e" stroke-width="1.4"></rect><rect x="552" y="302" width="32" height="32" rx="8" fill="#2d3a1a"></rect><g transform="translate(568 318)"><polygon points="2,-9 -5,1 -1,1 -2,9 5,-2 1,-2" fill="#b4f953"></polygon></g><text x="592" y="309" font-size="13" font-weight="700" fill="#fafafa">Wallet Lightning</text><text x="592" y="327" font-size="11" fill="#a3a3a3">zaps, por WebLN o NWC</text></g></g><line x1="216" y1="125" x2="268" y2="125" stroke="#b4f953" stroke-width="2" stroke-dasharray="5 5"  marker-end="url(#how-arrow)"></line><rect x="216" y="96" width="52" height="20" rx="10" fill="#b4f953"></rect><text x="242" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0a0a0a">Firmar</text><line x1="490" y1="125" x2="612" y2="125" stroke="#b4f953" stroke-width="2" stroke-dasharray="6 6"  marker-start="url(#how-arrow)" marker-end="url(#how-arrow)"></line><text x="551" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#b4f953">eventos firmados</text><text x="551" y="145" text-anchor="middle" font-size="11" fill="#a3a3a3">por un WebSocket</text><g stroke="#8bc34a" stroke-width="1.5" fill="none" stroke-dasharray="4 6" opacity="0.85"><path d="M362 210 C 362 248, 138 244, 138 280"  marker-end="url(#how-arrow)"></path><path d="M378 210 L 400 280"  marker-end="url(#how-arrow)"></path><path d="M394 210 C 394 248, 662 244, 662 280"  marker-end="url(#how-arrow)"></path></g><text x="400" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b4f953">Ningún servidor de Obelisk en el medio.</text></svg>