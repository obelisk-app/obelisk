<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-vesta-title hero-vesta-desc" class="w-full h-auto"><title id="hero-vesta-title">A Vesta island with dice derived from the event log</title><desc id="hero-vesta-desc">A hexagonal island of forest, brick, wool, grain and ore tiles with numbered dice tokens and player settlements, beside the line of the Nostr event log the dice roll is derived from — nobody at the table rolls their own numbers.</desc><defs><radialGradient id="bg-vesta" cx="0.4" cy="0.5" r="0.8"><stop offset="0%" stop-color="#101a20"></stop><stop offset="100%" stop-color="#0a0a0a"></stop></radialGradient></defs><rect width="800" height="400" fill="url(#bg-vesta)"></rect><g><polygon points="347.6,172.5 347.6,227.5 300.0,255.0 252.4,227.5 252.4,172.5 300.0,145.0" fill="#15803d" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon><circle cx="300" cy="200" r="17" fill="#0a0a0a" fill-opacity="0.75"></circle><text x="300" y="205" fill="#fafafa" font-size="15" font-weight="700" text-anchor="middle">10</text></g><g><polygon points="434.6,222.7 434.6,277.7 387.0,305.2 339.4,277.7 339.4,222.7 387.0,195.2" fill="#b45309" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon><circle cx="387" cy="250.22947341949742" r="17" fill="#0a0a0a" fill-opacity="0.75"></circle><text x="387" y="255.22947341949742" fill="#fafafa" font-size="15" font-weight="700" text-anchor="middle">5</text></g><g><polygon points="347.6,273.0 347.6,328.0 300.0,355.5 252.4,328.0 252.4,273.0 300.0,245.5" fill="#a8a29e" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon><circle cx="300" cy="300.45894683899485" r="17" fill="#0a0a0a" fill-opacity="0.75"></circle><text x="300" y="305.45894683899485" fill="#ff4d5e" font-size="15" font-weight="700" text-anchor="middle">8</text></g><g><polygon points="260.6,222.7 260.6,277.7 213.0,305.2 165.4,277.7 165.4,222.7 213.0,195.2" fill="#ca8a04" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon><circle cx="213" cy="250.22947341949742" r="17" fill="#0a0a0a" fill-opacity="0.75"></circle><text x="213" y="255.22947341949742" fill="#ff4d5e" font-size="15" font-weight="700" text-anchor="middle">6</text></g><g><polygon points="260.6,122.3 260.6,177.3 213.0,204.8 165.4,177.3 165.4,122.3 213.0,94.8" fill="#57534e" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon><circle cx="213" cy="149.77052658050258" r="17" fill="#0a0a0a" fill-opacity="0.75"></circle><text x="213" y="154.77052658050258" fill="#fafafa" font-size="15" font-weight="700" text-anchor="middle">9</text></g><g><polygon points="347.6,72.0 347.6,127.0 300.0,154.5 252.4,127.0 252.4,72.0 300.0,44.5" fill="#15803d" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon><circle cx="300" cy="99.54105316100512" r="17" fill="#0a0a0a" fill-opacity="0.75"></circle><text x="300" y="104.54105316100512" fill="#fafafa" font-size="15" font-weight="700" text-anchor="middle">4</text></g><g><polygon points="434.6,122.3 434.6,177.3 387.0,204.8 339.4,177.3 339.4,122.3 387.0,94.8" fill="#d6bd8a" fill-opacity="0.85" stroke="#b4f953" stroke-opacity="0.5" stroke-width="2"></polygon></g><g><line x1="249.77052658050258" y1="171" x2="300" y2="142" stroke="#e07b30" stroke-width="7" stroke-linecap="round"></line><rect x="240.77052658050258" y="162" width="18" height="18" rx="4" fill="#e07b30" stroke="#0a0a0a" stroke-width="2"></rect><rect x="291" y="133" width="18" height="18" rx="4" fill="#e07b30" stroke="#0a0a0a" stroke-width="2"></rect><rect x="341.2294734194974" y="220" width="18" height="18" rx="4" fill="#3498db" stroke="#0a0a0a" stroke-width="2"></rect></g><g font-size="12" font-weight="600"><text x="516" y="120" fill="#fafafa" font-size="15">Nobody rolls their own dice</text><text x="516" y="142" fill="#a3a3a3" font-size="11">the numbers come out of the event log</text><g font-family="ui-monospace, monospace"><rect x="516" y="164" width="236" height="30" rx="8" fill="#171717" stroke="#262626"></rect><text x="530" y="184" fill="#a3a3a3" font-size="11">entropy = 3f9c…a12 : 14</text><line x1="634" y1="196" x2="634" y2="216" stroke="#b4f953" stroke-opacity="0.6" stroke-width="2"></line><rect x="516" y="218" width="236" height="40" rx="8" fill="#171717" stroke="#b4f953" stroke-opacity="0.5"></rect><text x="536" y="244" fill="#b4f953" font-size="17" font-weight="700">4 + 3 = 7</text></g><g font-family="ui-monospace, monospace"><text x="516" y="282" fill="#a3a3a3" font-size="11">…and every client derives the same</text><text x="516" y="298" fill="#a3a3a3" font-size="11">roll from the same log.</text></g></g></svg>